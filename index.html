<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NFC Listener Demo</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f9fafb;
        padding: 2rem;
      }
      #status {
        margin-bottom: 1rem;
      }
      .card {
        padding: 1rem;
        background: white;
        border-left: 5px solid #3b82f6;
        margin-bottom: 1rem;
      }
      .card.success {
        border-left-color: #10b981;
      }
      .card.warning {
        border-left-color: #f59e0b;
      }
    </style>
  </head>
  <body>
    <h1>NFC Listener</h1>
    <div id="status">Status: 🔴 Disconnected</div>
    <div id="lastCard">Last Card UID: None</div>
    <div id="lastVerified">Last Verified UID: None</div>
    <div id="cardsContainer"></div>

    <script type="module">
      import { NfcHandler } from "./nfc-handler.js";

      const SOCKET_URL = "ws://127.0.0.1:8000"; // Your Socket.IO server
      const nfc = new NfcHandler(SOCKET_URL);

      const statusEl = document.getElementById("status");
      const lastCardEl = document.getElementById("lastCard");
      const lastVerifiedEl = document.getElementById("lastVerified");
      const cardsContainer = document.getElementById("cardsContainer");

      function showCard(message, type = "success") {
        const card = document.createElement("div");
        card.className = `card ${type}`;
        card.textContent = message;
        cardsContainer.appendChild(card);
        setTimeout(() => card.remove(), 5000);
      }

      nfc.onConnect(() => {
        statusEl.textContent = "Status: 🟢 Connected";
        showCard("Connected to server", "success");
      });

      nfc.onDisconnect(() => {
        statusEl.textContent = "Status: 🔴 Disconnected";
        showCard("Disconnected from server", "warning");
      });

      nfc.onCardUid((uid) => {
        lastCardEl.textContent = "Last Card UID: " + uid;
        showCard("Card UID: " + uid, "success");
      });

      nfc.onVerifiedUid((uid) => {
        lastVerifiedEl.textContent = "Last Verified UID: " + uid;
        showCard("Verified UID: " + uid, "success");
      });

      nfc.onReaderConnect((name) =>
        showCard(`Reader connected: ${name}`, "success")
      );
      nfc.onReaderDisconnect((name) =>
        showCard(`Reader disconnected: ${name}`, "warning")
      );
      nfc.onReadError((err) => showCard(`Read error: ${err}`, "warning"));

      nfc.open();
    </script>
  </body>
</html>
